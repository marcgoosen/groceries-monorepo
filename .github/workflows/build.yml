---
name: "Build"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: "read"
  pull-requests: "write"

jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"

      - name: "Set up JDK 21"
        uses: "actions/setup-java@v6"
        with:
          distribution: "temurin"
          java-version: "21"

      # v6's default `enhanced` cache is proprietary (license blocked for us); `basic` is MIT — keep it.
      - name: "Set up Gradle"
        uses: "gradle/actions/setup-gradle@v6"
        with:
          cache-provider: "basic"

      - name: "Build, check and test"
        run: "./gradlew build koverXmlReport"

      - name: "Integration test against a real Kafka and Schema Registry"
        run: "./gradlew integrationTest"

      - name: "Report coverage"
        if: "always()"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          python3 .github/scripts/coverage_summary.py > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" \
              --body-file coverage.md --edit-last --create-if-none
          fi

      - name: "Upload test results"
        if: "always()"
        uses: "actions/upload-artifact@v7"
        with:
          name: "test-results"
          path: |
            **/build/reports/tests/test
            **/build/reports/tests/integrationTest
          if-no-files-found: "ignore"

      - name: "Upload coverage report"
        if: "always()"
        uses: "actions/upload-artifact@v7"
        with:
          name: "coverage-report"
          path: "**/build/reports/kover"
          if-no-files-found: "ignore"
