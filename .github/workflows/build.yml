---
name: "Build"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: "read"
  pull-requests: "write"
  packages: "write"

jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"

      - name: "Set up JDK 21"
        uses: "actions/setup-java@v6"
        with:
          distribution: "temurin"
          java-version: "21"

      # v6's default `enhanced` cache is proprietary (license blocked for us); `basic` is MIT — keep it.
      - name: "Set up Gradle"
        uses: "gradle/actions/setup-gradle@v6"
        with:
          cache-provider: "basic"

      - name: "Build, check and test"
        run: "./gradlew build koverXmlReport"

      - name: "Integration test against a real Kafka and Schema Registry"
        run: "./gradlew integrationTest"

      - name: "Build the image into the runner's Docker daemon"
        run: "./gradlew publishImageToLocalRegistry"

      - name: "Start the compose stack with that image"
        run: "docker compose --profile app up -d"

      - name: "End-to-end test against the packaged image"
        run: "./gradlew e2eTest"

      - name: "Show the stack state and app logs if the end-to-end test failed"
        if: "failure()"
        run: |
          docker compose --profile app ps
          docker compose --profile app logs --no-color recommender

      - name: "Stop the compose stack"
        if: "always()"
        run: "docker compose --profile app down -v"

      - name: "Log in to GHCR"
        if: "github.ref == 'refs/heads/main'"
        uses: "docker/login-action@v3"
        with:
          registry: "ghcr.io"
          username: "${{ github.actor }}"
          password: "${{ github.token }}"

      - name: "Publish the image to GHCR"
        if: "github.ref == 'refs/heads/main'"
        env:
          GHCR_USERNAME: "${{ github.actor }}"
          GHCR_TOKEN: "${{ github.token }}"
        run: |
          ./gradlew publishImage -PimageTag="sha-${GITHUB_SHA:0:7}"
          ./gradlew publishImage -PimageTag="latest"

      - name: "Report coverage"
        if: "always()"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          python3 .github/scripts/coverage_summary.py > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" \
              --body-file coverage.md --edit-last --create-if-none
          fi

      - name: "Upload test results"
        if: "always()"
        uses: "actions/upload-artifact@v7"
        with:
          name: "test-results"
          path: |
            **/build/reports/tests/test
            **/build/reports/tests/integrationTest
            **/build/reports/tests/e2eTest
          if-no-files-found: "ignore"

      - name: "Upload coverage report"
        if: "always()"
        uses: "actions/upload-artifact@v7"
        with:
          name: "coverage-report"
          path: "**/build/reports/kover"
          if-no-files-found: "ignore"
