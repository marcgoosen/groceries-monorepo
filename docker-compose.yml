---
services:
  broker:
    image: "apache/kafka-native:4.3.1"
    hostname: "broker"
    container_name: "broker"
    ports:
      - "19092:9092"
      - "19101:9101"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:19092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: "localhost"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker:29093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      CLUSTER_ID: "local-cluster"

  schema-registry:
    image: "confluentinc/cp-schema-registry:8.3.1"
    hostname: "schema-registry"
    container_name: "schema-registry"
    depends_on:
      - "broker"
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: "schema-registry"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "broker:29092"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
    # Reaching this means Kafka is reachable too, since the registry stores its schemas there. It is what the
    # app waits for: producing before the registry can register a schema blocks the app on startup.
    healthcheck:
      # The image ships neither curl nor wget, but it does have python3. Hitting /subjects rather than just
      # the port matters: the listener opens before the registry can actually serve.
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8081/subjects', timeout=3)"
      interval: "5s"
      timeout: "5s"
      retries: 30
      start_period: "10s"

  kafka-ui:
    container_name: "kafka-ui"
    image: "kafbat/kafka-ui:v1.5.0"
    ports:
      - "9080:8080"
    depends_on:
      - "broker"
      - "schema-registry"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "broker:29092"
      KAFKA_CLUSTERS_0_METRICS_PORT: 9997
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: "http://schema-registry:8081"
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: "first"
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: "http://connect:8083"
      DYNAMIC_CONFIG_ENABLED: "true"

  # Not started by a plain `docker compose up` — that stays infrastructure only, so it does not clash with
  # `./gradlew run`. Bring it up with `docker compose --profile app up -d`.
  recommender:
    profiles: ["app"]
    container_name: "recommender"
    image: "${RECOMMENDER_IMAGE:-recommender-app:latest}"
    depends_on:
      schema-registry:
        condition: "service_healthy"
    ports:
      # 8080 is heavily contended; override RECOMMENDER_PORT if something else already has it.
      - "${RECOMMENDER_PORT:-8080}:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "broker:29092"
      KAFKA_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      MAIN_CREATE_TOPICS: "true"
      MAIN_START_SIMULATOR: "true"
